    <!-- Dynamic Content Loading Script -->
    <script>
      // Function to load HTML content into a div and process MathJax
      async function loadSection(containerId, filePath) {
        try {
          const response = await fetch(filePath);
          const html = await response.text();
          document.getElementById(containerId).innerHTML = html;
          
          // Process MathJax for the newly loaded content
          if (window.MathJax && window.MathJax.typesetPromise) {
            await window.MathJax.typesetPromise([document.getElementById(containerId)]);
          }
        } catch (error) {
          console.error(`Error loading ${filePath}:`, error);
        }
      }

      // Load all sections when the page loads
      document.addEventListener('DOMContentLoaded', function() {
        // Senior Design sections
        loadSection('senior-design-content', 'sections/senior-design.html');
        loadSection('sensor-design-content', 'sections/sensor-design.html');
        loadSection('mechanical-design-content', 'sections/mechanical-design.html');
        loadSection('portenta-camera-content', 'sections/portenta-camera.html');
        loadSection('results-section-content', 'sections/results-section.html');
        
        // Generator Competition sections
        loadSection('generator-competition-content', 'sections/generator-competition.html');
        loadSection('generator-theory-content', 'sections/generator-theory.html');
        loadSection('generator-mechanical-content', 'sections/generator-mechanical.html');
        loadSection('generator-results-content', 'sections/generator-results.html');
        
        // Other sections
        loadSection('gearbox-design-content', 'sections/gearbox-design.html');
        loadSection('mechatronics-content', 'sections/mechatronics.html');
      });
    </script>
